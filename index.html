<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Gingerbread Name Generator</title>
<style>
  :root {
    --red: #5C0E12;
    --green-bg: #0B3D1E;
    --gold: #FFC220;
    --card: #124A2A;
    --cream: #FFFAEE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, var(--red) 0%, var(--green-bg) 100%);
    color: var(--cream);
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 3px solid var(--gold);
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 {
    color: var(--gold);
    font-size: 1.7rem;
    margin: 0 0 6px;
  }
  p.sub {
    margin: 0 0 24px;
    opacity: 0.9;
    font-size: 0.95rem;
  }
  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    font-size: 1.1rem;
    border-radius: 12px;
    border: 2px solid var(--gold);
    background: var(--cream);
    color: var(--green-bg);
    margin-bottom: 16px;
    text-align: center;
  }
  input[type="text"]:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgba(255, 194, 32, 0.5);
  }
  button {
    width: 100%;
    padding: 14px 16px;
    font-size: 1.15rem;
    font-weight: bold;
    border-radius: 12px;
    border: none;
    background: var(--gold);
    color: var(--red);
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  button:active { transform: scale(0.97); }
  #result {
    margin-top: 26px;
    min-height: 70px;
  }
  #result .name {
    font-size: 1.6rem;
    font-weight: bold;
    color: var(--gold);
    line-height: 1.3;
    animation: pop 0.35s ease;
  }
  #result .tag {
    margin-top: 6px;
    font-size: 0.9rem;
    opacity: 0.85;
    font-style: italic;
  }
  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .footer {
    margin-top: 22px;
    font-size: 0.78rem;
    opacity: 0.7;
  }
  .icons { font-size: 1.4rem; margin-bottom: 10px; letter-spacing: 6px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icons">&#x1F36A; &#x2744;&#xFE0F; &#x1F384; &#x2744;&#xFE0F; &#x1F36A;</div>
    <h1>The Gingerbread Name Generator</h1>
    <p class="sub">Type your name, hit bake, and claim your official holiday party title.</p>
    <input type="text" id="nameInput" placeholder="Enter your name..." maxlength="40" autocomplete="off">
    <button id="bakeBtn">&#x1F36A; Bake My Name!</button>
    <div id="result"></div>
    <div class="footer">&#x2728; Same name always bakes the same way &#x2728;</div>
  </div>

<script>
  // Word banks -- all gingerbread/holiday-baking themed.
  var TITLES = [
    "Sir", "Dame", "Captain", "Duke", "Duchess", "Lord", "Lady",
    "General", "Professor", "Baron", "Mayor", "Chief"
  ];
  var FLAVORS = [
    "Gingersnap", "Molasses", "Cinnamon", "Nutmeg", "Peppermint",
    "Caramel", "Vanilla", "Clove", "Allspice", "Honeycomb",
    "Marzipan", "Butterscotch", "Toffee", "Eggnog", "Shortbread"
  ];
  var SURNAMES = [
    "Jollybelly", "Frostwhisker", "Sugarplum", "Crumblecrust",
    "Spicebeard", "Snowflake", "Jinglebread", "Sprinklebottom",
    "Candycane", "Icingtoes", "Doughface", "Merryfrost",
    "Cookiecrumb", "Tinseltoes", "Frostingbeard"
  ];

  // Simple deterministic string hash (djb2-ish) so a given name
  // always "bakes" into the same result every time it's entered.
  function hashString(str) {
    var hash = 5381;
    for (var i = 0; i < str.length; i++) {
      hash = ((hash * 33) ^ str.charCodeAt(i)) >>> 0;
    }
    return hash >>> 0;
  }

  // Full roster, so typing just a FIRST name still bakes to the same
  // result as the person's full name (which is what's pre-printed on
  // the party slides). Keep this list in sync with add_team_type_slides.py.
  var ROSTER = [
    "James Gilmore",
    "Natasha Bouchet", "Adam Herbert", "Boris Contreras", "CW Paglinawan",
    "Liz Luzcando", "Rohan Antony", "Sheila Leese", "Tochi Chukwu",
    "Ananya Mysuru Shylaprakash", "Devin Fitts", "Hadeer Davenport",
    "Hardik Bhatt", "Kris Quigley", "Lochlan Collins", "Nathan McCurry",
    "Nikki Raviprolu",
    "Mario Flores", "Mugdha Chaudhari", "Nancy Diaz", "Robert Seward",
    "Zarak Khan",
    "Andres Regino de La Cruz", "Divya Suhag", "Kyler Gray", "Morgan Green",
    "Nico Fano",
    "Bharath Narayanan", "Kratika Nayak", "Sushmita Dhanda",
    "Tejaswini Sapkota", "Teylor Spradlin",
    "Andres Prieto", "Ben Potash", "Carson Alsup", "Dan Ingle",
    "Jesse Chambers", "Karthika Suresh Sasikala", "Mathew Madsen",
    "Rachel Melilli", "Ted Boland",
    "Alex Chacon", "Andrew Loucks", "Carter Howie", "Cory Phelps",
    "Jennifer Gao", "Nidhi Mehta", "Nikhil Jain", "Sharath Prakash",
    "Tanuj Babele", "Tim Szaflarski", "Sri Jayaram",
    "Aishwarya Tumkur Venkatesh", "Bash Ramasami", "Calin Shirley",
    "David Cascio", "Josh Nugent", "Navya Pasapula", "Peyush Maini",
    "Roberto Arizmendi"
  ];

  // Hand-picked names for VIPs who didn't love their hash result --
  // keep in sync with NAME_OVERRIDES in add_team_type_slides.py.
  var NAME_OVERRIDES = {
    "james gilmore": "Chief Vanilla Crumblecrust",
    "roberto arizmendi": "Baron Nutmeg Doughface"
  };

  // Map first name (lowercase) -> full name, but ONLY for first names
  // that belong to exactly one roster person. If two people share a
  // first name (e.g. two "Andres"), typing just the first name falls
  // back to hashing the literal text instead of guessing wrong.
  var FIRST_NAME_MAP = (function () {
    var counts = {};
    ROSTER.forEach(function (full) {
      var first = full.trim().split(/\s+/)[0].toLowerCase();
      counts[first] = (counts[first] || 0) + 1;
    });
    var map = {};
    ROSTER.forEach(function (full) {
      var first = full.trim().split(/\s+/)[0].toLowerCase();
      if (counts[first] === 1) {
        map[first] = full;
      }
    });
    return map;
  })();

  function resolveFullName(rawName) {
    var clean = rawName.trim();
    var lower = clean.toLowerCase();
    for (var i = 0; i < ROSTER.length; i++) {
      if (ROSTER[i].toLowerCase() === lower) return ROSTER[i];
    }
    if (FIRST_NAME_MAP.hasOwnProperty(lower)) {
      return FIRST_NAME_MAP[lower];
    }
    return clean; // not a known roster person -- just use what they typed
  }

  function bakeName(rawName) {
    if (!rawName || !rawName.trim()) return null;
    var resolved = resolveFullName(rawName);
    var overrideKey = resolved.trim().toLowerCase();
    if (NAME_OVERRIDES.hasOwnProperty(overrideKey)) {
      return NAME_OVERRIDES[overrideKey];
    }
    var clean = resolved.trim().toLowerCase();
    var h = hashString(clean);
    var title = TITLES[h % TITLES.length];
    var flavor = FLAVORS[Math.floor(h / TITLES.length) % FLAVORS.length];
    var surname = SURNAMES[Math.floor(h / (TITLES.length * FLAVORS.length)) % SURNAMES.length];
    return title + " " + flavor + " " + surname;
  }

  var input = document.getElementById("nameInput");
  var resultDiv = document.getElementById("result");

  function renderResult() {
    var baked = bakeName(input.value);
    if (!baked) {
      resultDiv.innerHTML = "";
      return;
    }
    resultDiv.innerHTML =
      '<div class="name">&#x1F385; ' + baked + '</div>' +
      '<div class="tag">Your official holiday party name</div>';
  }

  document.getElementById("bakeBtn").addEventListener("click", renderResult);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") renderResult();
  });
</script>
</body>
</html>
